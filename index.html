<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Creative 3D - 学习项目</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" style="
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #111;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    ">
      <h2 style="color: #fff; margin-bottom: 20px; font-family: sans-serif;">加载中...</h2>
      <div style="width: 300px; background: #333; border-radius: 10px; overflow: hidden;">
        <div id="progress-bar" style="
          width: 0%;
          height: 8px;
          background: linear-gradient(90deg, #4f46e5, #7c3aed);
          border-radius: 10px;
          transition: width 0.3s ease;
        "></div>
      </div>
      <span id="progress-text" style="color: #aaa; margin-top: 10px; font-family: sans-serif; font-size: 14px;">0%</span>
    </div>

    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="homework">
        <canvas id="homework_canvas" />
      </div>
      <div id="ui">
        <h1>Three.js 学习</h1>
        <p>打开控制台查看输出</p>
      </div>
      <div id="controls"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
